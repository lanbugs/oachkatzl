services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: lanbugsde/oachkatzl:latest
    command: >-
      sh -c "python manage.py bootstrap && gunicorn -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 -b 0.0.0.0:5000 wsgi:app"
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env
    expose:
      - "5000"

  # pip caching proxy — workers pull packages from here instead of PyPI directly.
  # First request fetches from PyPI and caches; subsequent requests are served locally.
  # Remote workers can reach it via OACHKATZL_PIP_INDEX_URL=http://<host>:3141/root/pypi/+simple/
  devpi:
    image: muccg/devpi
    restart: unless-stopped
    volumes:
      - devpi_data:/data
    ports:
      - "3141:3141"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3141/root/pypi/+simple/ -o /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    image: lanbugsde/oachkatzl-worker:latest
    command: celery -A worker.celery worker -l info -c 4
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      devpi: { condition: service_started }
    env_file: .env
    environment:
      OACHKATZL_PIP_INDEX_URL: "http://devpi:3141/root/pypi/+simple/"
    volumes:
      - /tmp/oachkatzl:/tmp/oachkatzl
      - pip_cache:/root/.cache/pip

  beat:
    image: lanbugsde/oachkatzl-worker:latest
    command: celery -A beat.celery beat -l info
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env

  frontend:
    image: lanbugsde/oachkatzl-frontend:latest
    restart: unless-stopped
    ports:
      - "8888:80"
    depends_on:
      - api

volumes:
  mongo_data:
  redis_data:
  devpi_data:
  pip_cache:
